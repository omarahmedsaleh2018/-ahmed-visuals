<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فيديوهات Hover Effect</title>
  <style>
    .video-card {
      position: relative;
      width: 320px;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s ease;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .video-card:hover {
      transform: scale(1.08) translateY(-10px); /* Pop up effect */
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .video-card img, .video-card video {
      width: 100%;
      height: 180px;
      object-fit: cover;
      transition: all 0.4s ease;
    }

    /* تغيير اللون عند الـ hover */
    .video-card:hover img,
    .video-card:hover video {
      filter: brightness(1.1) saturate(1.3);
    }

    .video-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(transparent, rgba(0, 123, 255, 0.4));
      opacity: 0;
      transition: all 0.4s ease;
    }

    .video-card:hover::after {
      opacity: 1;
    }

    .title {
      padding: 12px;
      background: #222;
      color: white;
      text-align: center;
      transition: all 0.3s ease;
    }

    .video-card:hover .title {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <div class="video-card">
    <img src="https://via.placeholder.com/320x180?text=Video+1" alt="فيديو 1">
    <div class="title">عنوان الفيديو الأول</div>
  </div>

  <div class="video-card" style="margin-top: 30px;">
    <video muted loop>
      <source src="your-video.mp4" type="video/mp4">
    </video>
    <div class="title">عنوان الفيديو الثاني</div>
  </div>

</body>
</html>
