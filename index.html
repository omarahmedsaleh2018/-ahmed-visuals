<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth bg-[#030303]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed Visuals | AI Video Specialist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            content: [],
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #111;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .work-card {
            transition: all 0.4s ease;
        }
        .work-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2);
        }
    </style>
</head>
<body class="bg-[#030303] text-white font-sans">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#030303]/95 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="text-2xl font-bold">Ahmed <span class="text-emerald-400">Visuals</span></div>
            <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" 
               class="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 px-6 py-3 rounded-2xl font-semibold transition-all hover:scale-105">
                Chat on WhatsApp
            </a>
        </div>
    </header>

    <main class="pt-24">

        <!-- Hero -->
        <section class="max-w-6xl mx-auto px-6 py-16 text-center">
            <h1 class="text-4xl md:text-6xl font-bold leading-tight mb-6">
                فيديوهات AI تحول المشاهدات<br>إلى <span class="text-emerald-400">مبيعات حقيقية</span>
            </h1>
            <div class="max-w-5xl mx-auto mt-12 video-container">
                <iframe src="https://www.youtube.com/embed/C7c5VlzggXI" 
                        title="Ahmed Visuals" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen></iframe>
            </div>
        </section>

        <!-- Selected Work -->
        <section class="py-20 bg-[#0a0a0a]">
            <div class="max-w-7xl mx-auto px-6">
                <h2 class="text-4xl font-bold text-center mb-4">Selected Work</h2>
                <p class="text-zinc-400 text-center mb-12">أعمال مختارة - فيديوهات AI حققت نتايج حقيقية</p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

                    <!-- Video 1 -->
                    <div class="work-card bg-zinc-900 rounded-3xl overflow-hidden">
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/PASTE_LINK_1" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                    <!-- Video 2 -->
                    <div class="work-card bg-zinc-900 rounded-3xl overflow-hidden">
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/PASTE_LINK_2" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                    <!-- Video 3 -->
                    <div class="work-card bg-zinc-900 rounded-3xl overflow-hidden">
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/PASTE_LINK_3" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                    <!-- Video 4 -->
                    <div class="work-card bg-zinc-900 rounded-3xl overflow-hidden">
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/PASTE_LINK_4" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                    <!-- Video 5 -->
                    <div class="work-card bg-zinc-900 rounded-3xl overflow-hidden">
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/PASTE_LINK_5" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                    <!-- Video 6 -->
                    <div class="work-card bg-zinc-900 rounded-3xl overflow-hidden">
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/PASTE_LINK_6" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- Final CTA -->
        <section class="py-24 text-center bg-gradient-to-b from-transparent via-emerald-500/5 to-transparent">
            <h2 class="text-5xl font-bold mb-6">جاهز تزود مبيعاتك؟</h2>
            <p class="text-zinc-400 mb-10 max-w-md mx-auto">خلينا نناقش مشروعك ونشوف إزاي الفيديوهات الـ AI هتساعدك تحقق أرقام أعلى.</p>
            <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" 
               class="inline-flex items-center gap-3 bg-emerald-500 hover:bg-emerald-600 px-10 py-5 rounded-full text-xl font-semibold transition-all hover:scale-105">
                Chat on WhatsApp
            </a>
        </section>
    </main>
</body>
</html>
