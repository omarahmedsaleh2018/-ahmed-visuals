<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Visuals - فيديوهات</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #007bff;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 30px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .video-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .video-card:hover {
      transform: scale(1.1) translateY(-12px);
      box-shadow: 0 20px 35px rgba(0, 123, 255, 0.4);
    }

    .thumbnail {
      position: relative;
      height: 200px;
      background: #1a1a1a;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.5s ease;
    }

    .video-card:hover .thumbnail img {
      filter: brightness(0.7) saturate(1.5);
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .video-card:hover video {
      opacity: 1;
    }

    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 70px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 15px black;
      z-index: 5;
      transition: all 0.4s ease;
    }

    .video-card:hover .play-icon {
      color: #00ff88;
      transform: translate(-50%, -50%) scale(1.15);
    }

    .title {
      padding: 18px;
      background: #1a1a1a;
      text-align: center;
      font-weight: bold;
      transition: all 0.4s ease;
    }

    .video-card:hover .title {
      background: #007bff;
    }
  </style>
</head>
<body>
  <h1>Lumina Visuals</h1>
  
  <div class="container">
    <div class="video-card">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/340x200/222/fff?text=Video+1" alt="فيديو 1">
        <video muted loop>
          <source src="https://assets.mixkit.co/videos/preview/12345/12345-large.mp4" type="video/mp4">
        </video>
        <div class="play-icon">▶</div>
      </div>
      <div class="title">عنوان الفيديو الأول</div>
    </div>

    <!-- كارت ثاني (انسخ وعدل) -->
    <div class="video-card">
      <div class="thumbnail">
        <img src="https://via.placeholder.com/340x200/222/fff?text=Video+2" alt="فيديو 2">
        <video muted loop>
          <source src="https://assets.mixkit.co/videos/preview/12345/12345-large.mp4" type="video/mp4">
        </video>
        <div class="play-icon">▶</div>
      </div>
      <div class="title">عنوان الفيديو الثاني</div>
    </div>
  </div>
</body>
</html>
